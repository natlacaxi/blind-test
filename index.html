<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <title>BLIND TEST — SESSION DE 10 PISTES</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600&display=swap');

        :root {
            --bg: #0a0a0f;
            --panel: #111118;
            --border: #252535;
            --accent: #00d4ff;
            --accent2: #ff3080;
            --text: #e8e8f0;
            --text2: #9090a8;
            --green: #00ff88;
            --red: #ff4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .quiz-container {
            background-color: var(--panel);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            color: var(--accent);
            font-size: 24px;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.4);
        }

        .question-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: var(--text2);
            margin-bottom: 15px;
        }

        audio {
            width: 100%;
            margin-bottom: 25px;
            outline: none;
        }

        audio::-webkit-media-controls-panel {
            background-color: #181825;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-btn {
            background: #181825;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            border-color: var(--accent);
            background: #1e1e30;
        }

        .option-btn.correct {
            background-color: rgba(0, 255, 136, 0.15) !important;
            border-color: var(--green) !important;
            color: var(--green);
            font-weight: 600;
        }

        .option-btn.wrong {
            background-color: rgba(255, 68, 68, 0.15) !important;
            border-color: var(--red) !important;
            color: var(--red);
        }

        .action-btn {
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, var(--accent), #00a2ff);
            color: #000;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            padding: 14px 30px;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s, box-shadow 0.2s;
            display: none;
        }

        .action-btn:hover {
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
        }

        .score-container {
            display: none;
        }

        .score-container h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--accent2);
            font-size: 32px;
            margin-bottom: 15px;
        }
    </style>
</head>

<div class="quiz-container">
    <div id="quiz-game">
        <h1>Cosmic Blind Test</h1>
        <div class="question-number" id="question-title">Piste 1 / 10</div>
        
        <audio id="audio-player" controls controlsList="nodownload">
            <source id="audio-source" src="" type="audio/mpeg">
        </audio>

        <div class="options" id="options-container"></div>

        <button class="action-btn" id="next-button" onclick="nextQuestion()">Piste Suivante</button>
    </div>

    <div id="quiz-score" class="score-container">
        <h1>Session Terminée !</h1>

        <p id="score-comment"></p>
        <button class="action-btn" style="display: inline-block;" onclick="restartQuiz()">Nouvelle Session (10 titres)</button>
    </div>
</div>

    let quizData = []; // Contiendra les 10 pistes sélectionnées pour la session
    let currentTrackIndex = 0;
    let score = 0;
    let hasAnswered = false;

    const audioPlayer = document.getElementById('audio-player');
    const questionTitle = document.getElementById('question-title');
    const optionsContainer = document.getElementById('options-container');
    const nextButton = document.getElementById('next-button');

    function generateSession() {
        // Mélanger l'ensemble des 162 pistes et en extraire 10 au hasard
        let shuffled = [...allTracks].sort(() => Math.random() - 0.5);
        quizData = shuffled.slice(0, 10);
        currentTrackIndex = 0;
        score = 0;
    }

    function loadTrack() {
        hasAnswered = false;
        nextButton.style.display = "none";
        optionsContainer.innerHTML = "";

        const currentData = quizData[currentTrackIndex];
        questionTitle.innerText = `Piste ${currentTrackIndex + 1} / 10`;
        audioPlayer.src = currentData.audio;
        audioPlayer.load();

        // Création des choix (la bonne réponse + 3 faux choix tirés de la base globale)
        let choices = [currentData.name];
        while (choices.length < 4) {
            let randomTrack = allTracks[Math.floor(Math.random() * allTracks.length)].name;
            if (!choices.includes(randomTrack)) {
                choices.push(randomTrack);
            }
        }

        // Mélanger les 4 boutons d'options
        choices.sort(() => Math.random() - 0.5);

        choices.forEach(choice => {
            const button = document.createElement('button');
            button.className = 'option-btn';
            button.innerText = choice;
            button.onclick = () => verifySelection(choice, button);
            optionsContainer.appendChild(button);
        });
    }

    function verifySelection(selectedName, selectedButton) {
        if (hasAnswered) return;
        hasAnswered = true;

        const currentData = quizData[currentTrackIndex];
        const buttons = optionsContainer.getElementsByClassName('option-btn');

        if (selectedName === currentData.name) {
            selectedButton.classList.add('correct');
            score++;
        } else {
            selectedButton.classList.add('wrong');
            for (let btn of buttons) {
                if (btn.innerText === currentData.name) {
                    btn.classList.add('correct');
                }
            }
        }
        nextButton.style.display = "inline-block";
    }

    function nextQuestion() {
        audioPlayer.pause();
        currentTrackIndex++;
        if (currentTrackIndex < quizData.length) {
            loadTrack();
        } else {
            displayFinalScore();
        }
    }

    function displayFinalScore() {
        document.getElementById('quiz-game').style.display = "none";
        document.getElementById('quiz-score').style.display = "block";
        document.getElementById('final-score').innerText = score;
    }

    function restartQuiz() {
        document.getElementById('quiz-game').style.display = "block";
        document.getElementById('quiz-score').style.display = "none";
        generateSession();
        loadTrack();
    }

    // Initialisation au chargement de la page
    window.onload = function() {
        generateSession();
        loadTrack();
    };
</script>
